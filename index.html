<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Library Management System</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>📚 Library Management System</h1><p>Java + JDBC + MySQL</p></header>
<nav><button onclick="show('dashboard')">Dashboard</button><button onclick="show('books')">Books</button><button onclick="show('members')">Members</button><button onclick="show('issues')">Issue / Return</button></nav>
<main>
<section id="dashboard" class="page active"><h2>Dashboard</h2><div class="cards">
<div class="card"><b id="bookCount">0</b><span>Books</span></div><div class="card"><b id="memberCount">0</b><span>Members</span></div><div class="card"><b id="issueCount">0</b><span>Currently Issued</span></div>
</div></section>
<section id="books" class="page"><h2>Book Management</h2>
<form id="bookForm"><input name="title" placeholder="Title" required><input name="author" placeholder="Author" required><input name="category" placeholder="Category"><input name="isbn" placeholder="ISBN"><input name="quantity" type="number" min="1" value="1" required><button>Add Book</button></form>
<input id="bookSearch" placeholder="Search..." oninput="loadBooks()">
<table><thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>ISBN</th><th>Available</th><th></th></tr></thead><tbody id="booksTable"></tbody></table></section>
<section id="members" class="page"><h2>Member Management</h2>
<form id="memberForm"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email"><input name="phone" placeholder="Phone"><input name="address" placeholder="Address"><button>Add Member</button></form>
<input id="memberSearch" placeholder="Search..." oninput="loadMembers()">
<table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th></th></tr></thead><tbody id="membersTable"></tbody></table></section>
<section id="issues" class="page"><h2>Issue Book</h2>
<form id="issueForm"><input name="bookId" type="number" placeholder="Book ID" required><input name="memberId" type="number" placeholder="Member ID" required><input name="dueDate" type="date" required><button>Issue Book</button></form>
<h2>Issue / Return History</h2><table><thead><tr><th>ID</th><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Returned</th><th>Fine</th><th>Status</th><th></th></tr></thead><tbody id="issuesTable"></tbody></table></section>
</main><div id="toast"></div><script src="app.js"></script>
</body></html>
